# GitHub Actions Pipeline workflow.
#
# Single pipeline that:
#   1. Checks code quality (typecheck, lint, format, tests)
#   2. Smoke-builds the Docker image so we catch container breaks
#      before they reach a deploy
#   3. On main pushes, after both checks pass, deploys to Render
#
# The deploy job is gated on the `production` GitHub environment so
# the required-reviewer rule (configured in repo Settings →
# Environments) applies before any new code reaches the live site.
name: Pipeline

# Defines the triggers that cause this workflow to be enqueued.
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#on
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancels in-progress runs of the same workflow on the same ref
# when a new commit lands. Useful for protecting against drift.
# Docs: https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege token. Each job inherits these unless it sets its
# own `permissions:` block. CodeQL: actions/missing-workflow-permissions.
# Docs: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions:
  contents: read

# Defines the actual work to be done.
# Each job runs on a fresh runner (VM) by default, in parallel where possible.
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobs
jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Docs: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Docs: https://github.com/actions/setup-node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clean install dependencies exactly as locked in package-lock.json.
      # `npm ci` (not `npm install`) is mandatory in CI because:
      #   - It refuses to run if package.json and package-lock.json disagree.
      #   - It deletes node_modules first, fully reproducible install.
      - name: Install dependencies
        run: npm ci

      - name: Run aggregate check (typecheck + lint + format + test)
        run: npm run check

      - name: Build (production bundle)
        run: npm run build

  # Smoke-build the Dockerfile so we catch container-level breaks
  # before they reach a deploy.
  docker:
    name: Docker image smoke build
    runs-on: ubuntu-latest
    # If `check` fails, this job is skipped (no point smoke-testing Docker)
    # Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
    needs: check
    timeout-minutes: 10
    # `type=gha` cache reads/writes the GitHub Actions cache API, which
    # requires `actions: write` (read alone is enough for cache-from but
    # not for cache-to with mode=max).
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The classic `docker build` command does NOT support this.
      # Docs: https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Render after CI passes. Only runs on pushes to main —
  # PRs build + test but don't deploy.
  deploy:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both quality + Docker smoke must pass before we touch production.
    # Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
    needs: [check, docker]
    # Skip on PRs — only deploy on direct merges to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Docs: https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-deployments/managing-environments-for-deployment
    environment:
      name: production
      url: https://upano.onrender.com

    steps:
      # Docs: https://github.com/JorgeLNJunior/render-deploy
      - name: Trigger Render deploy
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
